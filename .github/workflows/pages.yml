name: Pages

# Publishes public/ to GitHub Pages (server.herton.work) on every push to main.
# Pages is a static host: the page shows its "static host" notes there; the server itself runs wherever `npm start` runs.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions" (configure-pages tries to do it for you).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: public/ matches site/
        run: |
          git diff --exit-code -- public || {
            echo "::error::public/index.html, public/404.html and public/sw.js are built from site/. Edit the file in site/ (not public/) and run npm run build, then commit both."
            exit 1
          }
      # A static host has no process, so /api/health would be a 404 — a console error, and Lighthouse's Best Practices
      # counts it. In the published copy only (never in public/), a file at that path says what this is; the page reads
      # it as "static host". On simple-server the route answers first and this file doesn't exist.
      - name: Static stand-in for /api/health
        run: |
          mkdir -p public/api
          printf '{"ok":false,"static":true,"note":"A static copy of the page: there is no process here. Clone the repository and run npm start for the live server."}\n' > public/api/health
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
